<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V-PARC · 반납 구역 추천</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 휴대폰 한 화면 폭(최대 430px) 앱. 화면 UI-01·02·03을 해시로 전환. 와이어프레임(10/13) 톤: 흰 바탕, 검정 주 버튼, 초록=적합, 주황=주의, 빨강=나쁜 예 */
:root{
  --bg:#ffffff; --ink:#0e0f11; --ink2:#5b5f66; --ink3:#8b9099; --line:#e6e8eb; --soft:#f3f4f6; --soft2:#eceef1;
  --btn:#0e0f11; --btnfg:#ffffff; --ok:#05a357; --okbg:#e6f6ee; --warn:#b25e00; --warnbg:#fff3dc; --bad:#e11900; --badbg:#fde9e6;
  --map:#f5f6f4; --mapgrid:#e3e5e1; --ring:#9aa0a6; --pin:#0e0f11; --pinfg:#ffffff; --dot:#b9bec5; --shade:rgba(14,15,17,.06);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --ink:#f2f3f5; --ink2:#b4b8bf; --ink3:#8a8f97; --line:#2a2c30; --soft:#1c1d20; --soft2:#26282c;
  --btn:#f2f3f5; --btnfg:#111214; --ok:#3ecf86; --okbg:#12301f; --warn:#ffc26b; --warnbg:#3a2a10; --bad:#ff6b57; --badbg:#3a1712;
  --map:#18191b; --mapgrid:#25272a; --ring:#6c7178; --pin:#f2f3f5; --pinfg:#111214; --dot:#4a4e55; --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --ink:#f2f3f5; --ink2:#b4b8bf; --ink3:#8a8f97; --line:#2a2c30; --soft:#1c1d20; --soft2:#26282c;
  --btn:#f2f3f5; --btnfg:#111214; --ok:#3ecf86; --okbg:#12301f; --warn:#ffc26b; --warnbg:#3a2a10; --bad:#ff6b57; --badbg:#3a1712;
  --map:#18191b; --mapgrid:#25272a; --ring:#6c7178; --pin:#f2f3f5; --pinfg:#111214; --dot:#4a4e55; --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.scr{display:flex;flex-direction:column;flex:1;min-height:0;padding-block:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1{font-size:28px;font-weight:800;margin:18px 0 20px;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:15px;font-weight:700;margin:22px 0 10px}
.cap{font-size:12.5px;color:var(--ink3);margin:8px 0 0}
.topbar{display:flex;align-items:center;gap:8px;height:44px}
.back{width:40px;height:40px;border-radius:20px;border:0;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.back svg{width:20px;height:20px}
.topbar .t{flex:1;text-align:center;font-weight:700;font-size:16px;margin-right:48px}
/* UI-01 */
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:0 12px;height:50px}
.search svg{width:18px;height:18px;color:var(--ink3);flex-shrink:0}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;height:100%}
.search .clr{border:0;background:var(--ink3);color:var(--bg);width:20px;height:20px;border-radius:10px;font-size:12px;line-height:20px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ic{width:36px;height:36px;border-radius:18px;background:var(--soft);display:grid;place-items:center;flex-shrink:0;color:var(--ink2)}
.item .ic svg{width:18px;height:18px}
.item b{display:block;font-size:15px;font-weight:600}
.item span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.item[aria-selected="true"] .ic{background:var(--btn);color:var(--btnfg)}
.grp{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.02em;margin:14px 0 2px}
.foot{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent);margin-top:auto;display:flex;gap:8px}
.btn{flex:1;height:52px;border-radius:12px;border:0;background:var(--btn);color:var(--btnfg);font-weight:700;font-size:16px}
.btn.sub{flex:0 0 38%;background:var(--soft2);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.note{font-size:12px;color:var(--ink3);line-height:1.6;margin:18px 0 6px}
/* UI-02 */
.mapwrap{position:relative;margin:4px -16px 0;height:300px;background:var(--map);overflow:hidden;flex-shrink:0}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:manipulation}
.mapwrap .back{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;background:var(--bg);box-shadow:0 1px 6px var(--shade)}
.maphint{position:absolute;right:12px;top:16px;font-size:11.5px;color:var(--ink2);background:var(--bg);padding:5px 9px;border-radius:999px;box-shadow:0 1px 6px var(--shade)}
.sheet{background:var(--bg);border-radius:18px 18px 0 0;margin:-18px -16px 0;padding:10px 16px 0;position:relative;flex:1;display:flex;flex-direction:column}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:19px;font-weight:800;margin:0}
.sheet .sub{font-size:13px;color:var(--ink3);margin:3px 0 14px}
.card{border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--bg);text-align:left;padding:0;width:100%}
.card .ph{position:relative;aspect-ratio:16/9;background:var(--soft);max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.62);padding:4px 8px;border-radius:6px}
.card .bd{padding:12px 14px 14px}
.ttl{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:15.5px;line-height:1.35}
.no{flex-shrink:0;width:22px;height:22px;border-radius:11px;background:var(--pin);color:var(--pinfg);font-size:12.5px;display:grid;place-items:center;margin-top:-1px}
.meta{font-size:13px;color:var(--ink2);margin:5px 0 0 30px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 30px}
.pill{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--soft2);color:var(--ink2)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.pill.g{background:var(--okbg);color:var(--ok)}
.row{display:flex;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.row .ic img{width:100%;height:100%;object-fit:cover}
.row b{display:block;font-size:14.5px;font-weight:600}
.row span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.cards{display:flex;flex-direction:column;gap:2px}
/* 구역 없음 */
.none{padding:6px 2px}
.none .where{font-size:12.5px;color:var(--ink3)}
.none .big{display:flex;gap:12px;align-items:center;margin:12px 0 16px}
.none .big .ic{width:40px;height:40px;border-radius:20px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.none .big b{font-size:21px;font-weight:800;line-height:1.3}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:500;margin:10px 0}
.chk i{width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px;flex-shrink:0}
.box{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.55}
.box b{color:var(--ink)}
/* UI-03 */
.zname{font-size:17px;font-weight:800;margin:14px 0 2px;line-height:1.35;text-wrap:balance}
.zname small{font-size:12.5px;color:var(--ink3);font-weight:500;margin-left:6px}
.hero{border-radius:12px;overflow:hidden;background:var(--soft);aspect-ratio:4/3;margin-top:10px;max-width:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.facts{margin-top:6px}
.fact{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.fact dt{color:var(--ink3);font-size:13px}
.fact dd{margin:0;font-weight:600;min-width:0}
.fact dd.w{color:var(--warn)}
.badlbl{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--bad);padding:4px 8px;border-radius:6px;margin:20px 0 10px}
.bads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bad .im{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--soft);max-width:100%}
.bad .im img{width:100%;height:100%;object-fit:cover;display:block}
.bad .x{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.bad b{display:block;font-size:13px;font-weight:700;margin-top:6px}
.bad span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.4}
.rec{font-size:12px;color:var(--ink3);margin:16px 0 4px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnfg);font-size:14px;font-weight:600;padding:11px 16px;border-radius:999px;max-width:calc(100% - 48px);z-index:20;box-shadow:0 4px 16px var(--shade)}
@media (prefers-reduced-motion:no-preference){.scr{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
#kmap{position:absolute;inset:0;z-index:0}
.mapwrap .back,.maphint{z-index:10}
.kpin{width:28px;height:28px;border-radius:14px;background:var(--pin);color:var(--pinfg);border:2px solid #fff;display:grid;place-items:center;font:700 13px/1 var(--font);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;transform:translateY(14px)}
.kdot{width:10px;height:10px;border-radius:5px;background:#9aa0a6;border:1.5px solid #fff;cursor:pointer;transform:translateY(5px)}
.kdest{background:var(--pin);color:var(--pinfg);font:700 11px/1 var(--font);padding:5px 8px;border-radius:5px;position:relative;margin-bottom:8px}
.kdest:after{content:"";position:absolute;left:50%;bottom:-8px;width:2px;height:8px;margin-left:-1px;background:var(--pin)}
</style>
</head><body>

<div class="app">
  <!-- UI-01 목적지·운영사 선택 -->
  <section class="scr" id="s1">
    <h1>어디로 가세요?</h1>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="목적지 검색 (예: 광교중앙역)" autocomplete="off">
      <button class="clr" id="qclr" type="button" aria-label="지우기" hidden>✕</button>
    </label>
    <h2>이용할 기체</h2>
    <div class="chips" id="ops" role="group" aria-label="운영사"></div>
    <p class="cap">운영사마다 반납할 수 있는 구역이 달라요</p>
    <div id="dlist"></div>
    <p class="note" id="srcnote"></p>
    <div class="foot"><button class="btn" id="go1" type="button" disabled>확인 구역 보기</button></div>
  </section>

  <!-- UI-02 확인 구역 추천 / 구역 없음 -->
  <section class="scr" id="s2" hidden>
    <div class="mapwrap">
      <div id="kmap" hidden></div>
      <svg id="map" role="img" aria-label="목적지 주변 지도"></svg>
      <button class="back" type="button" data-back aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="maphint">지도를 누르면 목적지가 옮겨져요</span>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <!-- UI-03 구역 상세·예시 -->
  <section class="scr" id="s3" hidden>
    <div class="topbar">
      <button class="back" type="button" data-back aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t">구역 자세히</div>
    </div>
    <div id="detail"></div>
    <div class="foot"><button class="btn" id="go3" type="button">이 구역으로 출발</button></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const OPS=[{k:'빔',v:'킥보드'},{k:'스윙',v:'킥보드'},{k:'지쿠',v:'킥보드'},{k:'일레클',v:'자전거'},{k:'카카오T바이크',v:'자전거'}];
// 목적지: 팀이 현장 조사 때 위치 메모를 남긴 장소의 사진 GPS 평균 좌표 (기록표 10/27)
const DEST=[
 {n:'아주대학교 정문 삼거리',a:'아주대·우만동',lat:37.27941,lon:127.04408},
 {n:'아주대학교병원 본관',a:'아주대·우만동',lat:37.27878,lon:127.04588},
 {n:'아주대요양병원',a:'아주대·우만동',lat:37.27742,lon:127.04871},

 {n:'롯데몰 광교 상가 거리',a:'광교중앙역·이의동',lat:37.28764,lon:127.05605},

 {n:'광교중앙로49번길 상가',a:'원천동·하동',lat:37.27897,lon:127.05029},
 {n:'가람마을사거리',a:'원천동·하동',lat:37.27585,lon:127.05113},

 {n:'광교호수공원 원천호수 서측',a:'원천동·하동',lat:37.28442,lon:127.0594},
 {n:'광교호수공원 가족캠핑장',a:'원천동·하동',lat:37.27551,lon:127.0642},
 {n:'흥덕중앙로 교차로',a:'원천동·하동',lat:37.2764,lon:127.0668},
 {n:'광교호수중학교',a:'원천동·하동',lat:37.27276,lon:127.0609}];
const CAUTION={A1:'연석 밖 차도·갓길에는 세우지 마세요',A2:'붉은 자전거도로 위는 피해 주세요',A3:'횡단보도 쪽 모서리 3m는 비워 주세요',A4:'소화전에서 5m 떨어뜨려 주세요',A6:'정류장·역 출구 5m 안은 피해 주세요',A7:'출입구·계단 앞 1m는 비워 주세요',A8:'바닥 주차금지 표시 위는 피해 주세요',B1:'점자블록 위에 바퀴가 올라가지 않게 해 주세요',B2:'점자블록에서 한 블록(30cm) 이상 떨어뜨려 주세요',C1:'보도 가운데 말고 건물·화단 쪽 가장자리에 붙여 주세요',C2:'지나갈 폭 1.5m는 남겨 주세요',C4:'좁은 길은 담장 쪽에 바짝 붙여 주세요',D1:'스탠드를 내려 넘어지지 않게 세워 주세요'};
const BADTXT={B1:['점자블록 위','바퀴가 블록에 올라감'],B2:['점자블록 바로 옆','한 블록 안쪽'],C1:['보도 한가운데','가장자리에서 떨어져 있어요'],A1:['차도 바로 옆','연석 밖 갓길'],A3:['횡단보도 3m 안','건너는 사람을 막아요'],D1:['넘어진 기체','스탠드 없이 기울어짐'],C2:['통로를 좁힘','남은 폭 1.5m 미만'],A2:['자전거도로 위','붉은 포장 위'],A4:['소화전 옆','5m 안'],A7:['출입구 앞','1m 안']};
const SPEED=1.2, DETOUR=1.25, LIMIT=120; // 도보 1.2m/s, 직선거리×1.25 보정 (실측 보정 전 가정값)
let DATA=null, st={op:'빔',dest:null,cands:[],zone:null};
const store={get(k,d){try{const v=localStorage.getItem('vparc.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('vparc.'+k,JSON.stringify(v))}catch(e){}}};
st.op=store.get('op','빔');

function dist(a,b){const R=6371000,r=Math.PI/180,dp=(b.lat-a.lat)*r,dl=(b.lon-a.lon)*r;const h=Math.sin(dp/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const walk=m=>m*DETOUR/SPEED;
const mins=s=>Math.max(1,Math.ceil(s/60));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

function placeOf(z){
  if(z.hint) return z.hint.split(',')[0].trim();
  let best=null,bd=1e9;for(const d of DEST){const m=dist(z,d);if(m<bd){bd=m;best=d}}
  return bd<250?best.n.replace(/ \(.*\)/,'')+' 근처':'조사 구역';
}
function sideOf(z){const w=(z.why[0]||'').split(',')[0].trim();return w||'가장자리에 나란히'}
function caution(z){const k=(z.near||[]).find(c=>CAUTION[c]);return k?CAUTION[k]:'건물·화단 쪽 가장자리에 나란히 세워 주세요'}
function tier(z){return (z.pz||z.n>=2)?0:1}

/* ---------- UI-01 ---------- */

}

  const clock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  if(q){

$('#q').addEventListener('input',()=>{if(st.dest&&$('#q').value!==st.dest.n)st.dest=null;renderDest()});

/* ---------- UI-02 ---------- */
function recommend(){
  const d=st.dest;
  const all=DATA.zones.map(z=>({z,m:dist(d,z)})).map(o=>({...o,s:walk(o.m)}));
  st.cands=all.filter(o=>o.s<LIMIT).sort((a,b)=>tier(a.z)-tier(b.z)||a.s-b.s).slice(0,3);
  st.nearest=all.sort((a,b)=>a.s-b.s)[0];
}
function drawSvgMap(){
  const svg=$('#map'), d=st.dest, W=svg.clientWidth||400, H=svg.clientHeight||300;
  const R=LIMIT*SPEED/DETOUR; // 2분 반경(직선)
  const span=Math.max(R*2.9, 300), k=Math.min(W,H)/span; // px per m
  const cx=W/2, cy=H*0.46, mlat=111320, mlon=111320*Math.cos(d.lat*Math.PI/180);
  const P=z=>[cx+(z.lon-d.lon)*mlon*k, cy-(z.lat-d.lat)*mlat*k];
  let g='';
  const step=50*k; for(let x=cx%step;x<W;x+=step)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--mapgrid)"/>`;
  for(let y=cy%step;y<H;y+=step)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--mapgrid)"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R*k}" fill="none" stroke="var(--ring)" stroke-width="1.3" stroke-dasharray="4 4"/>`;
  for(const z of DATA.zones){if(st.cands.some(o=>o.z===z))continue;const [x,y]=P(z);if(x<-10||x>W+10||y<-10||y>H+10)continue;g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--dot)"/>`}
  for(const o of DEST){if(o===d)continue;const [x,y]=P(o);if(x<0||x>W||y<0||y>H)continue;g+=`<text x="${x}" y="${y}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">${esc(o.n.replace(/ \(.*\)/,''))}</text>`}
  st.cands.forEach((o,i)=>{const [x,y]=P(o.z);g+=`<g data-z="${o.z.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="13" fill="var(--pin)" stroke="var(--bg)" stroke-width="2"/><text x="${x}" y="${y+4.5}" font-size="12.5" font-weight="700" fill="var(--pinfg)" text-anchor="middle">${i+1}</text></g>`});
  g+=`<g><rect x="${cx-26}" y="${cy-34}" width="52" height="20" rx="5" fill="var(--pin)"/><text x="${cx}" y="${cy-20}" font-size="11" font-weight="700" fill="var(--pinfg)" text-anchor="middle">목적지</text><line x1="${cx}" y1="${cy-14}" x2="${cx}" y2="${cy-4}" stroke="var(--pin)" stroke-width="2"/><rect x="${cx-4}" y="${cy-4}" width="8" height="8" fill="var(--pin)"/></g>`;
  const sb=50*k; g+=`<g transform="translate(${W-sb-16},${H-46})"><line x1="0" y1="10" x2="${sb}" y2="10" stroke="var(--ink2)" stroke-width="2"/><line x1="0" y1="5" x2="0" y2="10" stroke="var(--ink2)" stroke-width="2"/><line x1="${sb}" y1="5" x2="${sb}" y2="10" stroke="var(--ink2)" stroke-width="2"/><text x="${sb/2}" y="2" font-size="10.5" fill="var(--ink2)" text-anchor="middle">50 m</text></g>`;
  g+=`<text x="16" y="${H-28}" font-size="10.5" fill="var(--ink3)">점선 = 걸어서 2분 · 회색 점 = 다른 확인 구역</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.onclick=e=>{const t=e.target.closest('[data-z]');if(t){location.hash='zone-'+t.dataset.z.toLowerCase();return}
    const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
    st.dest={n:'지도에서 고른 곳',a:d.a,lat:d.lat-(y-cy)/(mlat*k),lon:d.lon+(x-cx)/(mlon*k),pick:true};renderZones()};
}
// ---- 카카오 지도 (실패하면 위 그림 지도로 대신) ----
const KAKAO_KEY='b174edef8b8810b085987f86b671837b';
let KM=null, kmFail=false, kmWait=null, kmTries=0;
function kakaoReady(){
  if(window.kakao&&kakao.maps&&kakao.maps.LatLng) return Promise.resolve();
  if(kmWait) return kmWait;
  kmWait=new Promise((ok,bad)=>{const s=document.createElement('script');
    s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&autoload=false`;
    const t=setTimeout(()=>bad(new Error('시간 초과')),15000);
    s.onload=()=>{try{kakao.maps.load(()=>{clearTimeout(t);ok()})}catch(e){clearTimeout(t);bad(e)}};
    s.onerror=()=>{clearTimeout(t);kmWait=null;bad(new Error('SDK 불러오기 실패'))}; document.head.appendChild(s)});
  return kmWait;
}
function kmPin(html,pos,z,onclick){const el=document.createElement('div');el.innerHTML=html;const n=el.firstElementChild;if(onclick)n.addEventListener('click',e=>{e.stopPropagation();onclick()});
  const o=new kakao.maps.CustomOverlay({position:pos,content:n,yAnchor:1,zIndex:z});o.setMap(KM.map);KM.ov.push(o);return o}
function drawMap(){
  if(kmFail) return drawSvgMap();
  kakaoReady().then(()=>{
    const d=st.dest, box=$('#kmap'), C=new kakao.maps.LatLng(d.lat,d.lon), R=LIMIT*SPEED/DETOUR;
    box.hidden=false; $('#map').style.visibility='hidden';
    if(!KM){KM={map:new kakao.maps.Map(box,{center:C,level:3}),ov:[]};
      kakao.maps.event.addListener(KM.map,'click',ev=>{const p=ev.latLng;st.dest={n:'지도에서 고른 곳',a:st.dest.a,lat:p.getLat(),lon:p.getLng(),pick:true};renderZones()});}
    KM.ov.forEach(o=>o.setMap(null)); KM.ov=[];
    KM.map.relayout(); KM.map.setCenter(C); KM.map.setLevel(R>180?4:3);
    KM.ov.push(new kakao.maps.Circle({map:KM.map,center:C,radius:R,strokeWeight:1.5,strokeColor:'#5b5f66',strokeOpacity:.9,strokeStyle:'dash',fillColor:'#0e0f11',fillOpacity:.04}));
    for(const z of DATA.zones){if(st.cands.some(o=>o.z===z))continue;if(dist(d,z)>R*3)continue;
      kmPin('<div class="kdot"></div>',new kakao.maps.LatLng(z.lat,z.lon),1,()=>{location.hash='zone-'+z.id.toLowerCase()})}
    st.cands.forEach((o,i)=>kmPin(`<div class="kpin">${i+1}</div>`,new kakao.maps.LatLng(o.z.lat,o.z.lon),3,()=>{location.hash='zone-'+o.z.id.toLowerCase()}));
    kmPin('<div class="kdest">목적지</div>',C,4,null);
  }).catch(e=>{console.warn('카카오 지도 실패, 그림 지도로 대신',e);kmTries=(window.kmTries||0)+1;window.kmTries=kmTries;if(kmTries>=2)kmFail=true;kmWait=null;$('#kmap').hidden=true;$('#map').style.visibility='';drawSvgMap();const hint=document.querySelector('.maphint');if(hint)hint.textContent='카카오 지도 못 불러옴('+(e&&e.message||e)+')';});
}
function renderZones(){
  if(!st.dest){location.hash='';return}
  recommend(); drawMap();
  const d=st.dest, c=st.cands;
  let h='';
  if(c.length){
    const o=c[0],z=o.z, same=z.brands.includes(st.op);
    h+=`<h3>목적지 근처 확인 구역</h3><p class="sub">${esc(d.n)} · 걸어서 2분 안 ${c.length}곳</p>
    <div class="cards"><button class="card" type="button" data-z="${z.id}">
      <div class="ph"><img src="photos/${esc(z.photo)}.jpg" alt="${esc(placeOf(z))}에 세운 기체 현장 사진" loading="lazy"><span class="tag">현장 사진</span></div>
      <div class="bd"><div class="ttl"><span class="no">1</span><span>${esc(placeOf(z))} · ${esc(sideOf(z))}</span></div>
      <div class="meta num">도보 ${mins(o.s)}분 · ${Math.round(o.m)}m · 현장 확인 ${z.n}장면</div>
      <div class="pills"><span class="pill w">${esc(caution(z))}</span>${z.pz?'<span class="pill g">지정 PM 주차구역</span>':''}${same?`<span class="pill">${esc(st.op)} 기체 확인</span>`:''}</div></div></button>`;
    c.slice(1).forEach((o,i)=>{const z=o.z;h+=`<button class="row" type="button" data-z="${z.id}"><span class="ic"><img src="photos/${esc(z.photo)}.jpg" alt="" loading="lazy"></span><span style="min-width:0"><b>${i+2}. ${esc(placeOf(z))} · ${esc(sideOf(z))}</b><span class="num">도보 ${mins(o.s)}분 · ${Math.round(o.m)}m · 현장 확인 ${z.n}장면</span></span></button>`});
    h+=`</div><div class="foot"><button class="btn sub" type="button" data-z="${z.id}">구역 자세히</button><button class="btn" type="button" data-go="${z.id}">이 구역으로 출발</button></div>`;
  }else{
    const gaps=store.get('gaps',[]); if(!gaps.some(g=>g.n===d.n&&Math.abs(g.lat-d.lat)<1e-5)){gaps.push({n:d.n,lat:+d.lat.toFixed(5),lon:+d.lon.toFixed(5),at:new Date().toISOString().slice(0,10)});store.set('gaps',gaps)}
    sendGap(d);
    const n=st.nearest;
    h+=`<div class="none"><div class="where">${esc(d.n)}</div>
      <div class="big"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><b>걸어서 2분 안에<br>확인 구역이 없어요</b></div>
      <div class="chk"><i>✓</i>건물·화단 쪽 가장자리에 세워 주세요</div>
      <div class="chk"><i>✓</i>구역 밖도 같은 기준으로 판정해요</div>
      <div class="box">이 목적지는 구역이 필요한 곳으로 기록돼요.${n?`<br>가장 가까운 확인 구역은 <b class="num">도보 약 ${mins(n.s)}분(${Math.round(n.m)}m)</b> 거리예요. <button type="button" data-z="${n.z.id}" style="border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline">보기</button>`:''}</div></div>
      <div class="foot"><button class="btn sub" type="button" id="ex">주차 예시</button><button class="btn" type="button" id="goany">이대로 출발</button></div>`;
  }
  $('#sheet').innerHTML=h;
}
$('#sheet').addEventListener('click',e=>{
  const z=e.target.closest('[data-z]'); if(z){location.hash='zone-'+z.dataset.z.toLowerCase();return}
  const g=e.target.closest('[data-go]'); if(g){start(g.dataset.go);return}
  if(e.target.id==='goany'){toast('구역 밖 반납도 같은 기준으로 판정해요');setTimeout(()=>{location.href=retUrl(null)},700)}
  if(e.target.id==='ex'&&st.nearest) location.hash='zone-'+st.nearest.z.id.toLowerCase();
});

      <div class="fact"><dt>찍을 위치</dt><dd>${esc(shoot)}</dd></div>

  window.scrollTo(0,0);

const OPCODE={'빔':'BEAM','스윙':'SWING','지쿠':'GCOO'};
// 시험 세션(?session=P01-A-1): 이 탭에서 기억해 두고 공백 기록·촬영 화면에 같이 넘긴다(집계에서 빠짐)
const SESSION=(()=>{const v=new URLSearchParams(location.search).get('session');try{if(v&&/^P\d{2}-[AB]-\d$/.test(v))sessionStorage.setItem('vparc.session',v);return sessionStorage.getItem('vparc.session')||''}catch(e){return v&&/^P\d{2}-[AB]-\d$/.test(v)?v:''}})();
// 목적지 ID: 웹 목록에는 ID가 없어 이름(지도에서 고른 곳은 좌표)으로 만든다. 서버는 W- ID를 처음 보면 목적지로 등록
function destId(d){const k=d.pick?`${d.lat.toFixed(4)},${d.lon.toFixed(4)}`:d.n;let h=0x811c9dc5;for(const c of k){h^=c.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return 'W-'+h.toString(16).padStart(8,'0')}
function destInfo(d){return {name:d.n.slice(0,80),lat:+d.lat.toFixed(5),lon:+d.lon.toFixed(5),region:d.a||null}}
// A5 허브 후보 입력: 구역 없는 목적지를 서버 공백 기록(POST /v1/gaps)으로. 같은 목적지는 하루 한 번, 모의 모드면 보내지 않음
function sendGap(d){
  const id=destId(d), day=new Date().toISOString().slice(0,10), sent=store.get('gaps_sent',{}), key=SESSION?id+'@'+SESSION:id;
  if(sent[key]===day)return;
  import('./api.js').then(({apiBase,uuid})=>{const base=apiBase();if(!base)return;
    return fetch(base+'/gaps',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({request_id:uuid(),destination_id:id,destination:destInfo(d),operator:OPCODE[st.op]||'BEAM',searched_at:new Date().toISOString(),...(SESSION?{test_session:SESSION}:{})})})
      .then(r=>{if(r.ok){sent[key]=day;store.set('gaps_sent',sent)}});
  }).catch(e=>console.warn('공백 기록 실패',e));
}
function shootUrl(z){const p=new URLSearchParams({new:'1',op:OPCODE[st.op]||'BEAM'});if(SESSION)p.set('session',SESSION);if(z){p.set('zone',z.id);p.set('place',placeOf(z)+' · '+sideOf(z))}else p.set('place',(st.dest&&st.dest.n)||'구역 밖');if(st.dest){const i=destInfo(st.dest);p.set('dest',st.dest.n);p.set('dest_id',destId(st.dest));p.set('dest_lat',i.lat);p.set('dest_lon',i.lon);if(i.region)p.set('dest_a',i.region)}return 'shoot.html?'+p}
const TIP={측면:'기체 옆으로 두세 걸음 물러나 바퀴 두 개와 바닥이 다 보이게',정면:'기체 앞에서 두세 걸음 물러나 양옆 바닥이 보이게','위(내려다봄)':'기체 옆에 서서 내려다보되 바퀴 두 개가 다 들어오게'};
// UI-04 반납하기 화면을 거쳐 촬영으로
function retUrl(z){const p=new URLSearchParams({next:shootUrl(z),op:OPCODE[st.op]||'BEAM'});if(z){p.set('zone',z.id);p.set('place',placeOf(z));p.set('side',sideOf(z));p.set('caution',caution(z));p.set('photo',z.photo);p.set('tip',TIP[z.angle]||TIP['측면'])}if(st.dest)p.set('dest',st.dest.n);return 'return.html?'+p}
try{if(!sessionStorage.getItem('vparc.rideStart'))sessionStorage.setItem('vparc.rideStart',String(Date.now()-11*60000))}catch(e){}
function start(id){const r=store.get('trips',[]);r.push({zone:id,dest:st.dest&&st.dest.n,op:st.op,at:new Date().toISOString()});store.set('trips',r.slice(-20));toast('도착하면 기체를 찍어 반납해요');const z=DATA.zones.find(x=>x.id===id);setTimeout(()=>{location.href=retUrl(z)},700)}
$('#go3').addEventListener('click',()=>st.zone&&start(st.zone.id));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{const h=location.hash.slice(1);location.hash=h.startsWith('zone-')&&st.dest?'zones':''}));

/* ---------- 라우팅 ---------- */
function route(){
  const h=location.hash.slice(1);
  const show=id=>['s1','s2','s3'].forEach(s=>$('#'+s).hidden=s!==id);
  if(h==='zones'&&st.dest){show('s2');renderZones()}
  else if(h.startsWith('zone-')){show('s3');renderDetail(h.slice(5))}
  else{show('s1');renderOps();renderDest()}
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{if(!$('#s2').hidden)drawMap()});
fetch('reco_data.json').then(r=>r.json()).then(j=>{DATA=j;
  $('#srcnote').textContent=`시험판 · 현장 사진으로 적합 판정을 받은 ${j.zones.length}곳을 확인 구역으로 써요 (기록표 10/27). 도보시간은 직선거리 기준 추정값이에요.`;
  if(!st.dest){const r=store.get('recent',[]);st.dest=DEST.find(d=>d.n===r[0])||null; if(st.dest)$('#q').value=st.dest.n;}
  if(!st.dest && !location.hash){st.dest=DEST.find(d=>d.n==='광교중앙역 출입구');$('#q').value=st.dest.n}
  route()}).catch(()=>{$('#dlist').innerHTML='<p class="note">구역 데이터를 불러오지 못했어요. 새로고침해 주세요.</p>'});
})();
</script>
</body></html>
