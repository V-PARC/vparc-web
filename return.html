<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반납하기 · V-PARC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* UI-04 반납 시작 (10/13 UI 설계 그림 기준). 추천 화면(index.html)과 같은 색·글꼴 */
:root{--bg:#fff;--ink:#0e0f11;--ink2:#5b5f66;--ink3:#8b9099;--line:#e6e8eb;--soft:#f3f4f6;--soft2:#eceef1;--btn:#0e0f11;--btnfg:#fff;--ok:#05a357;--okbg:#e6f6ee;--warn:#b25e00;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111214;--ink:#f2f3f5;--ink2:#b4b8bf;--ink3:#8a8f97;--line:#2a2c30;--soft:#1c1d20;--soft2:#26282c;--btn:#f2f3f5;--btnfg:#111214;--ok:#3ecf86;--okbg:#12301f;--warn:#ffc26b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--ink:#f2f3f5;--ink2:#b4b8bf;--ink3:#8a8f97;--line:#2a2c30;--soft:#1c1d20;--soft2:#26282c;--btn:#f2f3f5;--btnfg:#111214;--ok:#3ecf86;--okbg:#12301f;--warn:#ffc26b;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:max(12px,env(safe-area-inset-top,0px))}
h1{font-size:28px;font-weight:800;margin:18px 0 18px;letter-spacing:-.03em}
.card{background:var(--soft);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ride .ic{width:40px;height:40px;border-radius:20px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}
.ride .ic svg{width:22px;height:22px}
.ride b{display:block;font-size:15px}.ride span{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
.badge{margin-left:auto;background:var(--ok);color:#fff;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;flex-shrink:0}
.ex img,.zone img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--soft2)}
.ex b{display:block;font-size:14.5px;margin-bottom:5px}
.exl{display:block;margin-top:2px}.exl em{font-style:normal;font-weight:700;color:var(--ink);margin-right:6px}.ex p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.ex a,.zone a{color:var(--ink);font-size:12.5px;font-weight:700;text-decoration:none}
h2{font-size:15px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center}
h2 a{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.zone{background:none;border:1px solid var(--line)}
.zone img{width:48px;height:48px;border-radius:8px}
.zone b{display:block;font-size:14px}.zone span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.note{font-size:12px;color:var(--ink3);text-align:center;margin:auto 0 10px;padding-top:24px}
.btn{display:block;width:100%;height:52px;border-radius:12px;border:0;background:var(--btn);color:var(--btnfg);font:inherit;font-weight:700;font-size:16px;text-align:center;line-height:52px;text-decoration:none}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin:14px -16px 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);text-decoration:none;min-width:60px}
.tabs a[aria-current]{color:var(--ink);font-weight:700}
.tabs svg{width:22px;height:22px}

/* 한글은 단어 단위로 줄바꿈 (한두 글자만 다음 줄로 넘어가지 않게) */
body{word-break:keep-all;overflow-wrap:break-word}
p,span,b,dd,li,h1,h2,h3,button,a,div{text-wrap:pretty}
</style>
</head>
<body>
<main class="app">
  <h1>반납하기</h1>
  <div class="card ride">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M8 17.5h8l-3-11h3M13 6.5l-5 11"/></svg></span>
    <div><b>이용 중</b><span class="num" id="usage">-</span></div>
    <span class="badge">주행 중</span>
  </div>
  <div class="card ex">
    <img id="exImg" alt="예시 사진" src="photos/1-JTW-216.jpg">
    <div style="min-width:0"><b>이렇게 세우고 찍어 주세요</b><p id="exText"></p><a id="exLink" href="./">주차 예시 보기 →</a></div>
  </div>
  <h2>고른 확인 구역 <a href="./#zones">바꾸기</a></h2>
  <div class="card zone" id="zone">
    <img id="zImg" alt="">
    <div style="min-width:0"><b id="zName"></b><span id="zSub"></span></div>
  </div>
  <p class="note">원본 사진은 휴대폰 밖으로 나가지 않아요</p>
  <a class="btn" id="go" href="shoot.html">주차 사진 찍기</a>
  <nav class="tabs" aria-label="아래 메뉴">
    <a href="return.html" aria-current="page" id="tabHome"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>홈</a>
    <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>주차 구역</a>
    <a href="#" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>이용 내역</a>
    <a href="#" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>계정</a>
  </nav>
</main>
<script>
const q=new URLSearchParams(location.search), $=id=>document.getElementById(id);
// 주소가 없으면(탭에서 다시 열 때) 마지막으로 고른 구역을 씀
let p=q; try{ if(q.toString()) sessionStorage.setItem('vparc.pick',q.toString()); else p=new URLSearchParams(sessionStorage.getItem('vparc.pick')||''); }catch(e){}
$('tabHome').href='return.html?'+p;
// 이용 시간·요금: 결과 화면과 같은 계산(기본 1,000원 + 분당 150원)
let t0=Date.now(); try{t0=+sessionStorage.getItem('vparc.rideStart')||t0}catch(e){}
function usage(){const m=Math.max(1,Math.round((Date.now()-t0)/60000));$('usage').textContent=`${m}분 · ${(1000+150*m).toLocaleString('ko-KR')}원`}
usage(); setInterval(usage,30000);
function setEx(a,b){const e=$('exText');e.textContent='';for(const [k,v] of [['세우기',a],['찍기',b]]){const d=document.createElement('span');d.className='exl';const s=document.createElement('em');s.textContent=k;d.append(s,v);e.append(d)}}
const zone=p.get('zone');
if(zone){
  const ph=`photos/${p.get('photo')}.jpg`;
  $('exImg').src=ph; $('zImg').src=ph;
  // 짧게 두 줄: 세우는 곳 / 찍는 법
  const SHORT={'기체 옆으로 두세 걸음 물러나 바퀴 두 개와 바닥이 다 보이게':'옆에서 바퀴 두 개와 바닥이 보이게','기체 앞에서 두세 걸음 물러나 양옆 바닥이 보이게':'앞에서 양옆 바닥이 보이게','기체 옆에 서서 내려다보되 바퀴 두 개가 다 들어오게':'위에서 바퀴 두 개가 다 보이게'};
  const where=(p.get('caution')||'').replace(/\s*세워 주세요\.?$/,'').replace(/\s*주세요\.?$/,'');
  setEx(where, SHORT[p.get('tip')]||'옆에서 바퀴 두 개와 바닥이 보이게');
  $('exLink').href='./#zone-'+zone.toLowerCase();
  $('zName').textContent=p.get('place')||'확인 구역';
  $('zSub').textContent=p.get('side')||'';
}else{
  setEx('건물·화단 쪽 가장자리에 나란히','옆에서 바퀴 두 개와 바닥이 보이게');
  $('exLink').href='./';
  $('zImg').hidden=true; $('zName').textContent=p.get('dest')?`${p.get('dest')} 근처 · 구역 밖`:'고른 구역 없음';
  $('zSub').textContent='구역 밖 반납도 같은 기준으로 판정해요';
}
// 촬영 화면 주소는 추천 화면이 만들어 넘김(next). 없으면 여기서 만듦
let next=p.get('next');
if(!next){const s=new URLSearchParams({new:'1',op:p.get('op')||'BEAM'});
  if(zone){s.set('zone',zone);s.set('place',`${p.get('place')} · ${p.get('side')}`)} else s.set('place',p.get('dest')||'구역 밖');
  if(p.get('dest'))s.set('dest',p.get('dest')); next='shoot.html?'+s}
$('go').href=next;
</script>
</body>
</html>
