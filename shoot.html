<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>주차 사진 · V-PARC</title>
<meta name="description" content="V-PARC 반납 촬영 화면. 원본 사진과 위치는 이 폰 밖으로 전송되지 않습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    letter-spacing: -0.01em; -webkit-tap-highlight-color: transparent; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .top { height: 56px; display: flex; align-items: center; padding: 0 12px; position: relative; flex-shrink: 0; }
  .top a { width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.16); color: #fff;
    display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative; z-index: 1; }
  .top h1 { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; pointer-events: none; }
  .top .att { position: absolute; right: 14px; font-size: 12px; color: #9a9a9a; }
  .stage { position: relative; flex: 1; min-height: 0; background: #1a1a1a; border-radius: 16px; overflow: hidden; }
  video, #shot, #testImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shot, #testImg { display: none; }
  .frame { position: absolute; left: 24px; right: 24px; top: 24px; bottom: 84px; border: 2px solid rgba(255,255,255,.85);
    border-radius: 18px; pointer-events: none; transition: border-color .2s; }
  .frame.ok { border-color: #05A357; }
  .pill { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100% - 32px);
    display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 600; color: #000; background: #fff;
    padding: 11px 16px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.25); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 4px; background: #FFC043; flex-shrink: 0; }
  .pill.ok .dot { background: #05A357; }
  .pill.err .dot { background: #E11900; }
  .pill span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .busy { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; font-size: 16px; font-weight: 600; }
  .spin { width: 34px; height: 34px; border-radius: 17px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; color: #cfcfcf; font-size: 15px; line-height: 1.5; }
  .start button, .bottom button.text { appearance: none; border: 0; font: inherit; font-weight: 600; border-radius: 10px; }
  .start button { background: #fff; color: #000; height: 50px; padding: 0 22px; font-size: 16px; }
  .bottom { height: 132px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; flex-shrink: 0; }
  .shutter { appearance: none; width: 76px; height: 76px; border-radius: 38px; border: 4px solid #fff; background: transparent;
    padding: 0; display: flex; align-items: center; justify-content: center; }
  .shutter span { width: 60px; height: 60px; border-radius: 30px; background: #fff; transition: transform .1s; }
  .shutter:active span { transform: scale(.9); }
  .shutter:disabled { opacity: .35; }
  .bottom button.text { flex: 1; height: 54px; font-size: 16px; }
  .bottom button:disabled { opacity: .4; }
  .bottom .gray { background: #2b2b2b; color: #fff; }
  .bottom .white { background: #fff; color: #000; flex: 1.4; }
  .foot { text-align: center; font-size: 11.5px; color: #8a8a8a; padding: 0 16px 8px; flex-shrink: 0; min-height: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="./" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 id="title">주차 사진</h1>
    <span class="att" id="att"></span>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <img id="testImg" alt="">
    <canvas id="shot"></canvas>
    <div class="frame" id="frame" hidden></div>
    <div class="pill" id="pill" hidden><span class="dot"></span><span id="hintText"></span></div>
    <div class="start" id="start">
      <div id="startMsg">킥보드 바퀴 두 개와 바닥이<br>다 보이게 찍어 주세요.</div>
      <button id="btnStart">카메라 켜기</button>
      <div style="font-size:13px;color:#8a8a8a">원본 사진과 위치는 휴대폰 밖으로 나가지 않아요</div>
    </div>
    <div class="busy" id="busy" hidden><div class="spin"></div><div id="busyText">사람을 가리고 있어요</div></div>
  </div>

  <div class="bottom" id="barShoot">
    <button class="shutter" id="btnShutter" aria-label="촬영" disabled><span></span></button>
  </div>
  <div class="bottom" id="barReview" hidden>
    <button class="text gray" id="btnRetake">다시 찍기</button>
    <button class="text white" id="btnUse">이 사진으로 반납</button>
  </div>
  <div class="foot" id="foot">준비 중이에요</div>
</div>

<script type="module">
import { SHOOT_TEXT } from './messages.js';
import { loadJudge, makeGuide, grayStats } from './judge.js';
import { redact } from './redact.js';
import { makeApi, toScreen, uuid } from './api.js';

// ---- 설정 ----
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`;
const MP_WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`;
const MP_DET = 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite';
const MP_SEG = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite';
const MP_FACE = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const PERSON = 15;                                  // DeepLab v3(PASCAL VOC)의 사람 클래스
const TARGET = new Set(['bicycle', 'motorcycle', 'skateboard']);   // 킥보드는 COCO에 없어서 비슷한 클래스로 대신 잡음
const EVERY_MS = 333, MAX_SIDE = 1280;
const API_REASON = { none: 'NO_VEHICLE', cut: 'CROPPED', floor: 'NO_GROUND', blur: 'BLUR', light: 'BACKLIGHT' };
const HINT = { ...SHOOT_TEXT };

const q = new URLSearchParams(location.search);
const TEST = q.get('test') === 'img';
const STATIC = q.get('guide') === 'static';         // 예비 시험 A안: AI 안내 없이 고정 문구만 (T14 비교용)               // 카메라 대신 사진으로 시험 (?test=img&src=ok.jpg)
const $ = (id) => document.getElementById(id);
const video = $('video'), testImg = $('testImg');
const source = () => (TEST ? testImg : video);
const srcSize = () => (TEST ? [testImg.naturalWidth, testImg.naturalHeight] : [video.videoWidth, video.videoHeight]);
const api = makeApi();
const S = { detector: null, segmenter: null, face: null, judge: null, guide: null, live: false, busy: false, lastCheck: 0, lastTs: 0,
  box: null, boxScore: 0, mpFailed: false, shot: null, shotBox: null, startedAt: 0 };
window.__vparc = S;

// ---- 반납 세션 (다시 찍으면 같은 return_id, attempt + 1) ----
function session() { try { return JSON.parse(sessionStorage.getItem('vparc.return') || 'null'); } catch { return null; } }
function saveSession(s) { try { sessionStorage.setItem('vparc.return', JSON.stringify(s)); } catch {} }
let ret = session();
if (q.get('new') === '1') ret = null;
async function ensureReturn() {
  if (ret?.returnId) return ret;
  const body = { request_id: uuid(), operator: q.get('op') || 'BEAM', vehicle_type: 'KICKBOARD', zone_id: q.get('zone') || null,
    destination_id: q.get('dest') || null, ...(/^P\d{2}-[AB]-\d$/.test(q.get('session') || '') ? { test_session: q.get('session') } : {}), client: { app_version: '0.4.0', device: navigator.platform, browser: navigator.userAgent.slice(0, 120) } };
  try {
    const r = await api.startReturn(body);
    ret = { returnId: r.return_id, startedAt: Date.now(), attempt: 0, place: q.get('place') || '시험 장소' };
  } catch (e) {
    ret = { returnId: null, startedAt: Date.now(), attempt: 0, place: q.get('place') || '시험 장소', startError: String(e.message || e) };
  }
  saveSession(ret); return ret;
}

// ---- 화면 ----
function pill(text, kind) {
  $('pill').hidden = false; $('hintText').textContent = text;
  $('pill').classList.toggle('ok', kind === 'ok'); $('pill').classList.toggle('err', kind === 'err');
}
function showHint(key) {
  if (STATIC) { pill('킥보드 바퀴 두 개와 바닥이 다 보이게 찍어 주세요'); return; }   // A안: 상태와 상관없이 같은 문구
  pill(HINT[key] || key, key === 'ready' ? 'ok' : null); $('frame').classList.toggle('ok', key === 'ready');
}
function foot() {
  const parts = [];
  parts.push(S.judge ? (S.judge.mock ? '판단 모델: 시험용' : `판단 모델 v2 ${S.judge.cached ? '저장본' : '새로 받음'}${S.judge.retried ? '(재시도)' : ''} ${Math.round(S.judge.ms)}ms`) : (S.judgeError ? `판단 모델 못 불러옴(${S.judgeError.slice(0, 90)}) → 밝기·흔들림만` : '판단 모델 받는 중'));
  parts.push(S.detector || window.__mockDets ? '검출 켜짐' : (S.mpFailed ? '검출 꺼짐' : '검출 준비 중'));
  parts.push(api.mock ? '판정: 모의(API 주소 없음)' : '판정 API 연결');
  if (STATIC) parts.push('A안(고정 문구)');
  $('foot').textContent = parts.join(' · ');
}

// ---- MediaPipe ----
let vision = null;
async function mp() {
  if (vision) return vision;
  const mod = await import(MP_URL);
  const fs = await mod.FilesetResolver.forVisionTasks(MP_WASM);
  vision = { mod, fs }; return vision;
}
async function make(ctor, opts) {
  const { mod, fs } = await mp();
  try { return await mod[ctor].createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'GPU' } }); }
  catch { return await mod[ctor].createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'CPU' } }); }
}
async function loadDetector() {
  if (window.__mockDets) return;
  try { S.detector = await make('ObjectDetector', { baseOptions: { modelAssetPath: MP_DET }, runningMode: TEST ? 'IMAGE' : 'VIDEO', scoreThreshold: 0.3, maxResults: 5 }); }
  catch (e) { console.warn('검출 모델 실패', e); S.mpFailed = true; }
  foot();
}
async function loadRedactors() {                    // 셔터 전에 미리 받아 둠 (가림은 반납 누를 때 실행)
  if (window.__mockSeg !== undefined) return;
  try { S.segmenter = await make('ImageSegmenter', { baseOptions: { modelAssetPath: MP_SEG }, runningMode: 'IMAGE', outputCategoryMask: true, outputConfidenceMasks: false }); }
  catch (e) { console.warn('사람 분할 모델 실패', e); S.segError = String(e); }
  try { S.face = await make('FaceDetector', { baseOptions: { modelAssetPath: MP_FACE }, runningMode: 'IMAGE', minDetectionConfidence: 0.4 }); }
  catch (e) { console.warn('얼굴 검출 모델 실패', e); }
}
function detect() {
  const [vw, vh] = srcSize(); if (!vw) return null;
  let dets = [];
  if (window.__mockDets) dets = window.__mockDets(source());
  else if (S.detector) {
    if (TEST) dets = S.detector.detect(testImg).detections;
    else { const t = performance.now(); S.lastTs = Math.max(t, S.lastTs + 1); dets = S.detector.detectForVideo(video, S.lastTs).detections; }
  } else return undefined;                          // 검출기 없음: 박스 모름
  const boxes = dets.filter(d => TARGET.has(d.categories[0]?.categoryName));
  if (!boxes.length) return null;
  const b = boxes.sort((a, c) => c.boundingBox.width * c.boundingBox.height - a.boundingBox.width * a.boundingBox.height)[0];
  const bb = b.boundingBox;
  return { x: bb.originX / vw, y: bb.originY / vh, w: bb.width / vw, h: bb.height / vh, score: b.categories[0].score };
}

// 판단 가능성 모델을 못 불러왔을 때: 예전 규칙(밝기·흔들림·박스 위치)으로 같은 모양의 확률을 만듦
function fallbackProbs(box) {
  const { bright, back, sharp } = grayStats(source());
  const p = { none: 0, cut: 0, floor: 0, blur: sharp < 150 ? 1 : 0, light: (bright < 45 || back > 70) ? 1 : 0 };
  if (box === null) p.none = 1;
  else if (box) { if (box.x < 0.02 || box.x + box.w > 0.98 || box.y < 0.02) p.cut = 1; if (box.y + box.h > 0.97) p.floor = 1; }
  p.sufficient = Object.values(p).some(v => v) ? 0 : 1;
  return p;
}

async function tick(now) {
  if (!S.live) return;
  if (!S.busy && srcSize()[0] && now - S.lastCheck > EVERY_MS) {
    S.lastCheck = now; S.busy = true;
    try {
      const box = detect();
      if (box !== undefined) S.box = box;
      const probs = S.judge ? await S.judge.run(source(), box || null) : fallbackProbs(box);
      const key = S.guide.push(probs, performance.now());
      if (key && S.live) showHint(key);
    } catch (e) { console.warn(e); }
    S.busy = false;
  }
  requestAnimationFrame(tick);
}

// ---- 시작 ----
async function startCamera() {
  if (TEST) { testImg.src = q.get('src') || 'ok.jpg'; await testImg.decode(); testImg.style.display = 'block'; video.style.display = 'none'; return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } } });
  video.srcObject = stream; await video.play();
  await new Promise(r => video.readyState >= 2 ? r() : video.addEventListener('loadeddata', r, { once: true }));
}
function beginLive() {
  $('start').hidden = true; $('frame').hidden = false;
  S.guide.reset(); showHint('loading'); S.startedAt = performance.now();
  S.live = true; requestAnimationFrame(tick);
}
$('btnStart').addEventListener('click', async () => {
  $('btnStart').disabled = true;
  try {
    if (!TEST && !navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라를 쓸 수 없어요');
    await startCamera();
  } catch (e) {
    $('btnStart').disabled = false;
    $('startMsg').innerHTML = '카메라를 켜지 못했어요.<br>설정에서 카메라 권한을 허용해 주세요.';
    return;
  }
  ensureReturn().then(r => { $('att').textContent = `${r.attempt + 1}번째`; });
  if (!S.guide) S.guide = makeGuide(S.judge?.meta);
  beginLive();
  $('btnShutter').disabled = false;
  loadDetector(); loadRedactors();
});
// 모델은 페이지를 열자마자 받기 시작 (카메라 켜기 누르기 전)
loadJudge().then(j => { S.judge = j; S.guide = makeGuide(j.meta); foot(); })
  .catch(e => { console.warn('판단 가능성 모델 실패', e); S.judgeError = String(e.message || e); S.guide = S.guide || makeGuide(null); foot(); });
foot();
if (ret?.attempt) $('att').textContent = `${ret.attempt + 1}번째`;

// ---- 셔터: 막지 않음. 화면을 멈추고 긴 변 1280px로 줄여 둠 ----
$('btnShutter').addEventListener('click', () => {
  const [w0, h0] = srcSize(); const k = Math.min(1, MAX_SIDE / Math.max(w0, h0));
  const c = $('shot'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(source(), 0, 0, c.width, c.height);
  S.live = false; S.shot = c; S.shotBox = S.box ? { ...S.box } : null;
  S.shotGuide = { ready: S.guide.st.current === 'ready', last_reason: API_REASON[S.guide.st.current] || null,
    elapsed_ms: Math.round(performance.now() - S.startedAt), timeout_15s: performance.now() - S.startedAt > S.guide.cfg.giveUpMs, reason: S.guide.st.current };
  c.style.display = 'block'; video.style.visibility = 'hidden'; testImg.style.visibility = 'hidden';
  $('frame').hidden = true; $('barShoot').hidden = true; $('barReview').hidden = false;
  $('title').textContent = '사진 확인';
  if (STATIC) pill('이 사진으로 반납할까요?');
  else pill(S.shotGuide.ready ? '잘 찍혔어요' : '판정이 애매하면 추가 확인으로 접수돼요', S.shotGuide.ready ? 'ok' : null);
});
$('btnRetake').addEventListener('click', () => {
  $('shot').style.display = 'none'; video.style.visibility = 'visible'; testImg.style.visibility = 'visible';
  $('barShoot').hidden = false; $('barReview').hidden = true; $('title').textContent = '주차 사진';
  beginLive();
});

// ---- 반납: 가림 → 판정 API → 결과 화면 ----
const fmtTime = (d) => { const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0'); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${m}`; };
async function doRedact(c, boxN) {
  const pxBox = boxN ? { x: boxN.x * c.width, y: boxN.y * c.height, w: boxN.w * c.width, h: boxN.h * c.height } : null;
  if (window.__mockSeg === 'fail') return { lost: true, failed: true, blob: null };
  if (window.__mockSeg === 'none') return redact(c, pxBox, {});                  // 시험용: 사람 없음
  const seg = window.__mockSeg !== undefined ? window.__mockSeg : S.segmenter;
  if (!seg) {
    // 사람 분할 모델이 없으면 가렸다고 볼 수 없음 → 사진 없이 접수 (원본은 보내지 않음)
    return { lost: true, failed: true, blob: null, reason: S.segError || '분할 모델 없음' };
  }
  return redact(c, pxBox, { segmenter: seg || null, faceDetector: S.face, personIndex: window.__mockSeg ? undefined : PERSON });
}
$('btnUse').addEventListener('click', async () => {
  $('btnUse').disabled = true; $('btnRetake').disabled = true; $('busy').hidden = false; $('busyText').textContent = '사람을 가리고 있어요';
  try {
    if (!S.segmenter && window.__mockSeg === undefined) await loadRedactors();
    const r = await ensureReturn();
    const red = await doRedact(S.shot, S.shotBox);
    // 가린 사진으로 화면에 보여 줄 것 (가림 실패면 사진 없음)
    const photoUrl = red.blob ? await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(red.blob); }) : null;
    const attempt = (r.attempt || 0) + 1;
    const b = S.shotBox;
    const meta = {
      request_id: uuid(), attempt, captured_at: new Date().toISOString(),
      box: b ? { x1: +b.x.toFixed(4), y1: +b.y.toFixed(4), x2: +(b.x + b.w).toFixed(4), y2: +(b.y + b.h).toFixed(4), score: +(b.score || 0).toFixed(3), label: 'kickboard' } : null,
      in_zone: q.get('in_zone') === '0' ? false : true, caution: [],
      redaction: { status: red.failed ? 'FAILED' : (red.lost ? 'EVIDENCE_LOSS' : 'OK'), masked_ratio_box: +(red.box || 0).toFixed(3), masked_ratio_ground: +(red.floor || 0).toFixed(3) },
      capture_guide: { ready: S.shotGuide.ready, last_reason: S.shotGuide.last_reason, elapsed_ms: S.shotGuide.elapsed_ms, timeout_15s: S.shotGuide.timeout_15s },
      guide_mode: STATIC ? 'A_static' : 'B_ai',
      model_versions: { detector: 'mediapipe-efficientdet-lite0', judgability: S.judge && !S.judge.mock ? 'jdg-v2' : 'rule-v1' },
    };
    $('busyText').textContent = '주차 위치를 확인하고 있어요';
    if (!r.returnId) throw new Error(r.startError || '반납 시작 실패');
    const res = await api.judge(r.returnId, meta, red.blob);
    r.attempt = attempt; saveSession(r);
    const mins = Math.max(1, Math.round((Date.now() - r.startedAt) / 60000));
    const screen = toScreen(res, { returnId: r.returnId, attempt, time: fmtTime(new Date()), place: r.place, photoUrl,
      usage: { min: mins, fee: 1000 + 150 * mins }, lastReason: S.shotGuide.reason });
    sessionStorage.setItem('vparc.result', JSON.stringify(screen));
    location.href = 'result.html?from=shoot';
  } catch (e) {
    console.warn(e);
    $('busy').hidden = true; $('btnUse').disabled = false; $('btnRetake').disabled = false;
    pill('보내지 못했어요. 연결을 확인하고 다시 눌러 주세요', 'err');
    const why = (e && (e.status ? 'HTTP ' + e.status + ' ' : '') + (e.message || e)) || '알 수 없음';
    $('foot').textContent = '오류: ' + String(why).slice(0, 160);   // 아이폰 원인 확인용
  }
});
</script>
</body>
</html>
